<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SensorLab-IMX410</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* fpSup palette (Bei 10-25): logo pink, K2 cyan, hair yellow; neutral grey grounds; follows the system theme.
   The simulated camera screen (#cam) keeps its own fixed dark colours: it is the camera's LCD. */
:root{
  --bg:#f6f6f6; --panel:#fff; --line:#e4e4e4; --ink:#151515; --dim:#5e5e5e;
  --sig:#d01245; --info:#00737a; --warn:#8c6a00; --sensor:#dcdcdc; --fill:rgba(208,18,69,.10); --fill2:rgba(0,115,122,.10); --fill3:rgba(140,106,0,.12); --fill4:rgba(58,111,208,.14); --fill5:rgba(60,154,79,.12);
  --r:#d0394f; --g:#3c9a4f; --b:#3a6fd0; --btn:#ececec; --btnline:#cfcfcf;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans","PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --panel:#151515; --line:#252525; --ink:#ececec; --dim:#9a9a9a;
  --sig:#fb144e; --info:#01f7fb; --warn:#fdee02; --sensor:#2c2c2c; --fill:rgba(251,20,78,.14); --fill2:rgba(1,247,251,.10); --fill3:rgba(253,238,2,.10); --fill4:rgba(108,155,255,.16); --fill5:rgba(95,210,122,.12);
  --r:#ff5c70; --g:#5fd27a; --b:#6c9bff; --btn:#22272c; --btnline:#3a4148; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --panel:#151515; --line:#252525; --ink:#ececec; --dim:#9a9a9a;
  --sig:#fb144e; --info:#01f7fb; --warn:#fdee02; --sensor:#2c2c2c; --fill:rgba(251,20,78,.14); --fill2:rgba(1,247,251,.10); --fill3:rgba(253,238,2,.10); --fill4:rgba(108,155,255,.16); --fill5:rgba(95,210,122,.12);
  --r:#ff5c70; --g:#5fd27a; --b:#6c9bff; --btn:#22272c; --btnline:#3a4148; color-scheme:dark }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55;
  padding-block:20px 48px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
main { max-width:1440px; margin:0 auto; display:grid; gap:18px 24px; min-width:0;
  grid-template-columns:minmax(0,2fr) minmax(0,3fr); grid-template-areas:"head sim" "details sim" "foot foot"; align-items:start; }
main > header { grid-area:head; min-width:0; } main > .sim { grid-area:sim; } main > #details { grid-area:details; min-width:0; }
main > .page-foot { grid-area:foot; }
@media (min-height:880px) { main > .sim { position:sticky; top:12px; } }   /* the camera stays in view while the details scroll */
#details { display:grid; gap:18px; }
/* Phones (the camera QR's main entry): summary, the diagram, the simulator, then the other details. */
@media (max-width:899px) { main { grid-template-columns:minmax(0,1fr); grid-template-areas:none; }
  main > * { grid-area:auto !important; } main > .sim { position:static; }
  #details { display:contents; }
  main > header { order:1; } #details > .frame-card { order:2; } main > .sim { order:3; }
  #details > .grid2 { order:4; } #details > section:last-child { order:5; } main > .page-foot { order:6; } }
.top { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:12px; }
h1 { font-size:clamp(1.05rem,5vw,1.5rem); margin:0; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
h2 { font-family:var(--mono); font-size:.72rem; letter-spacing:.11em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; font-weight:600; }
.lede { color:var(--dim); margin:4px 0 0; max-width:70ch; min-height:calc(1.55em * 3); }
@media (min-width:900px) { .lede { min-height:calc(1.55em * 2); } }
.lang { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none; }
.lang button { font:500 .78rem var(--mono); background:none; border:0; color:var(--dim); padding:5px 11px; cursor:pointer; }
.lang button[aria-pressed="true"] { background:var(--sig); color:#fff; }
#notice { border:1px solid var(--warn); border-left-width:4px; border-radius:8px; padding:10px 14px; margin-top:12px; font-size:.9rem; overflow-wrap:anywhere; }
#notice ul { margin:6px 0 0; padding-left:1.2em; font-family:var(--mono); font-size:.8rem; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; min-width:0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip { font-family:var(--mono); font-size:.78rem; border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap; text-align:center; }
.chip b { color:var(--sig); font-weight:600; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:680px) { .grid2 { grid-template-columns:1fr; } }
.card svg { display:block; width:100%; height:auto; max-width:100%; }
.card svg text { font-family:var(--mono); fill:var(--ink); }
#frame { max-width:640px; margin:0 auto; }
.cap { color:var(--dim); font-size:.86rem; margin:10px 0 0; min-height:calc(1.55em * 5); }
.frame-card .cap { min-height:0; }
.legend { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:10px; margin-top:12px; }
.legend div { border-left:3px solid var(--line); padding-left:10px; font-size:.85rem; color:var(--dim); min-height:calc(1.55em * 7); }
@media (max-width:899px) { .legend div { min-height:calc(1.55em * 5); } }
.legend b { display:block; color:var(--ink); font-family:var(--mono); font-size:.8rem; }
.legend .s0 { border-color:var(--g); } .legend .s1 { border-color:var(--sig); } .legend .s2 { border-color:var(--warn); } .legend .s3 { border-color:var(--info); } .legend .s4 { border-color:var(--b); }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr)); gap:10px; }
.stat .k { font-family:var(--mono); font-size:.68rem; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
.stat .v { font-family:var(--mono); font-size:1.4rem; font-weight:600; font-variant-numeric:tabular-nums; }
.stat .s { font-size:.8rem; color:var(--dim); min-height:calc(1.55em * 2); }
.bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:6px; }
.bar i { display:block; height:100%; background:var(--info); }
.bar i.hot { background:var(--warn); } .bar i.over { background:var(--sig); }
.page-foot { color:var(--dim); font-size:.8rem; text-align:center; }
[hidden] { display:none !important; }

/* ---- the simulator: the camera's QS screen + the controls ---- */
.sim { display:grid; gap:12px; min-width:0; }
#cam { --tile:rgba(28,30,33,.6); --line:rgba(255,255,255,.18); --fg:#fff; --mute:#c3cad0;
  --focus:#45b8e3; --approx:#f0b44c; --lock:#ff5a4f; color:var(--fg); font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  width:100%; aspect-ratio:1024/682; position:relative; overflow:hidden; border-radius:6px; background:#000; user-select:none; line-height:normal; }
.tile .t { width:100%; justify-content:center; }
.s .qslock { height:2em; width:auto; display:block; margin:-.45em auto 0; }
#liveview { position:absolute; display:block; background:#62645f; }
#cam.closed #qs { display:none; }
.tile .qrsq { width:80.078125%; aspect-ratio:1; flex:none; background:#fff; display:block; }
.tile .qrsq svg { display:block; width:100%; height:100%; shape-rendering:crispEdges; }
#qs { position:absolute; inset:0; }
/* Native 1024 x 682 QS layer: 256 x 223 tiles at y=77 and y=308. */
.row { position:absolute; width:100%; height:32.697947%; display:grid; grid-template-columns:repeat(4,1fr); background:var(--tile); border-top:1px solid var(--line); }
#r0 { top:11.290323%; } #r1 { top:45.161290%; }
.tile { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-left:1px solid var(--line); gap:2%; cursor:pointer; min-width:0; overflow:hidden; }
.tile:first-child { border-left:0; }
.tile .t { font-size:clamp(9px,2.1vw,22px); color:#e8e8e8; letter-spacing:.02em; height:1.3em; display:flex; align-items:center; gap:.3em; }
.tile .icon { border:2px solid #e8e8e8; border-radius:2px; padding:0 .15em; font-size:.8em; font-weight:700; line-height:1.1; }
.tile .v { font-size:clamp(12px,3.2vw,34px); font-weight:700; height:1.25em; white-space:nowrap; }
.tile .s { font-size:clamp(8px,1.7vw,18px); color:var(--mute); height:1.2em; white-space:nowrap; font-weight:500; }
/* the QS panel is lighter than the camera's so the scene (and its rolling-shutter lean) shows; a soft shadow keeps text legible */
.tile .t, .tile .v, .tile .s, #ael { text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.5); }
.tile .s.approx { color:var(--approx); }
.tile .s.ok { color:#5fc46a; } .tile .s.bad, #footer .o.bad small { color:var(--lock); } #footer .o.ok small { color:#5fc46a; }
.tile.f { outline:3px solid var(--focus); outline-offset:-3px; background:rgba(0,0,0,.45); }
.tile .tarr { position:absolute; top:0; bottom:0; width:22%; display:flex; align-items:center; color:var(--focus);
  font-size:clamp(10px,1.8vw,18px); cursor:pointer; touch-action:manipulation; }
.tile .tarr.l { left:0; justify-content:flex-start; padding-left:3%; } .tile .tarr.r { right:0; justify-content:flex-end; padding-right:3%; }
#qsbtn { position:absolute; top:1.5%; left:1%; z-index:2; font:700 clamp(10px,1.8vw,18px) system-ui,sans-serif; color:#111; background:#bbb;
  border:0; border-radius:99px; padding:.2em .7em; cursor:pointer; touch-action:manipulation; }
#qsbtn[aria-pressed="false"] { background:var(--focus); }
.tile.blank { cursor:default; }
.lockred { color:var(--lock); }
#hintbar { position:absolute; top:77.859238%; height:11.290323%; width:100%; display:flex; justify-content:flex-end; align-items:stretch; }
#ael { background:var(--tile); display:flex; align-items:center; gap:.5em; padding:0 1.2em; font:inherit; font-size:clamp(10px,2.3vw,24px); color:var(--fg); border:0; cursor:pointer; touch-action:manipulation; }
#ael b { background:#bbb; color:#111; border-radius:99px; padding:0 .5em; font-size:.8em; }
#footer { position:absolute; bottom:0; width:100%; height:10.850440%; background:#000; display:flex; align-items:center; justify-content:center; gap:0; overflow:hidden; padding:0 2%; }
#footer .o { padding:.35em .6em; font-size:clamp(9px,1.9vw,20px); border:2px solid transparent; white-space:nowrap; cursor:pointer; text-align:center; line-height:1.15; }
#footer .o small { display:block; font-size:.62em; color:var(--mute); }
#footer .o.approx small { color:var(--approx); }
#footer .o.sel { border-color:var(--focus); }
#footer .o.mk { text-decoration:underline dotted var(--focus) 3px; text-underline-offset:5px; }
#footer .o.cu { color:#ffd66b; }
#footer .o.na { color:#55595e; cursor:default; }
#footer .o.na small { color:#8a6f3a; }
#footer .arrow { color:var(--focus); padding:0 .4em; }
#footer .arrow.sp { color:#fff; padding:0 1.2em; touch-action:manipulation; cursor:pointer; font-size:clamp(10px,1.6vw,18px); }
#footer .o.big { font-size:clamp(14px,3vw,32px); font-weight:500; min-width:5em; }
#side { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:10px 18px; font-size:14px; min-width:0; align-items:start; }
#side p { margin:0; }
.keys { color:var(--dim); line-height:1.6; }
.rsbox { display:grid; gap:6px; }
.seg { display:flex; align-items:center; border:1px solid var(--line); border-radius:999px; overflow:hidden; width:max-content; max-width:100%; }
.seg .seglab { font:500 .74rem var(--mono); color:var(--dim); padding:4px 8px 4px 12px; }
.seg button { font:500 .74rem var(--mono); background:none; border:0; color:var(--dim); padding:5px 10px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--info); color:var(--panel); }
#rs-now { display:block; height:calc(2 * 1.5em); line-height:1.5; white-space:pre; overflow:hidden; font:12px/1.5 var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); }
#state { font-family:var(--mono); font-size:12px; line-height:1.5; height:calc(5 * 1.5em + 22px); overflow:auto; color:var(--dim); white-space:pre; background:var(--panel); border:1px solid var(--line); padding:10px; border-radius:8px; margin:0; }
#connection { margin:0; color:var(--dim); line-height:1.6; min-height:calc(1.6em * 3); }
</style></head><body>
<main>
<header>
  <div class="top">
    <h1 id="title">SensorLab-IMX410</h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en">EN</button><button data-l="hans">简</button><button data-l="hant">繁</button>
    </div>
  </div>
  <p class="lede" id="lede"></p>
  <div id="notice" role="alert" hidden></div>
  <div class="chips" id="chips"></div>
</header>
<section class="sim" aria-labelledby="sim-h">
<h2 id="sim-h" data-t="hSim" style="grid-column:1/-1;margin:0">Quick Set simulator</h2>
<div id="cam">
<svg id="liveview" viewBox="0 319 6048 3402" preserveAspectRatio="none" role="img" aria-label="Sensor crop and output aspect ratio preview">
  <defs>
    <linearGradient id="scene" x2="0.8" y2="1"><stop stop-color="#577d88"/><stop offset="1" stop-color="#c09a70"/></linearGradient>
    <pattern id="grid" width="504" height="505" patternUnits="userSpaceOnUse"><path d="M504 0H0V505" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6"/></pattern>
  </defs>
  <!-- #scene-g leans for the rolling-shutter preview (site_page.js); wider than the sensor so a lean never shows a gap -->
  <g id="scene-g">
  <rect x="-1512" width="9072" height="4040" fill="url(#scene)"/>
  <path d="M-1512 3100 0 3100 1100 1650 2200 2840 3700 1150 5200 2920 6048 2000 7560 2000V4040H-1512Z" fill="#324b4c" opacity=".65"/>
  <rect x="-1512" width="9072" height="4040" fill="url(#grid)"/>
  <g fill="none" stroke="#fff" opacity=".75" stroke-width="12">
    <circle cx="3024" cy="2020" r="700"/><path d="M2124 2020H3924M3024 1120V2920"/>
    <rect x="504" y="505" width="5040" height="3030" stroke-dasharray="30 30"/>
  </g>
  </g>
  <!-- stock FHD at the same pan, for comparison: the same verticals and centre mark, dashed -->
  <g id="ghost" fill="none" stroke="#45b8e3" stroke-width="14" stroke-dasharray="60 40" opacity=".95" style="display:none">
    <path d="M1008 0V4040M2016 0V4040M3024 0V4040M4032 0V4040M5040 0V4040"/><circle cx="3024" cy="2020" r="700"/>
  </g>
</svg>
<button id="qsbtn" type="button" aria-pressed="true">QS</button>
<div id="qs">
  <div></div>
  <div class="row" id="r0"></div>
  <div class="row" id="r1"></div>
  <div id="hintbar"><button id="ael" type="button"><b>AEL</b>More options</button></div>
  <div id="footer"></div>
  <div></div>
</div></div>
<div id="side">
  <p id="connection" role="status">Loading simulator…</p>
  <div class="rsbox">
    <div class="seg" role="group" aria-label="Pan speed"><span class="seglab" data-t="rsPan">Pan</span><button type="button" data-pan="off" data-t="rsOff">Off</button><button type="button" data-pan="slow" data-t="rsSlow">Slow</button><button type="button" data-pan="fast" data-t="rsFast">Fast</button></div>
    <label class="keys"><input type="checkbox" id="rs-compare"> <span data-t="rsCompare">Compare with stock FHD</span></label>
    <span id="rs-now"></span>
    <p class="keys" data-t="rsLean"></p>
  </div>
  <p class="keys" data-t="howTo"></p>
  <p class="keys" data-t="bgNote"></p>
  <pre id="state"></pre>
</div>
</section>
<div id="details" class="details">
  <section class="card frame-card">
    <h2 data-t="hFrame"></h2>
    <svg id="frame" role="img"></svg>
    <p class="cap" data-t="frameCap"></p>
    <div class="legend" id="legend"></div>
  </section>
  <div class="grid2">
    <section class="card">
      <h2 data-t="hMerge"></h2>
      <svg id="merge" viewBox="0 0 300 220" role="img"></svg>
      <p class="cap" id="mergeCap"></p>
    </section>
    <section class="card">
      <h2 data-t="hKernel"></h2>
      <svg id="kernel" viewBox="0 0 300 220" role="img"></svg>
      <p class="cap" id="kernelCap"></p>
    </section>
  </div>
  <section class="card">
    <h2 data-t="hStats"></h2>
    <div class="stats" id="stats"></div>
    <svg id="rs" viewBox="0 0 640 80" role="img" style="margin-top:14px"></svg>
    <p class="cap" data-t="rsCap"></p>
  </section>
</div>
<footer class="page-foot">SensorLab-IMX410 · fpSup</footer>
</main>
<script src="fps_data.js"></script>
<script src="site_page.js"></script>
<script>
// ---- geometry (matrix.json presets; width aligned 16, height even) -----------------------------------
const PX_MM = 35.9 / 6048, WMAX = 6048, HMAX = 4040, WMIN = 256, HMIN = 144;
const DCS = [['OG',6048,4040],['HD',6048,3402],['S35',4192,2358],['APS-C',3952,2624],['S16',2096,1240],['SQ',4032,4032]];
const RATIOS = [[1,'×1'],[2/3,'÷1.5'],[1/2,'÷2'],[1/3,'÷3'],[1/6,'÷6']];
const KS = [1,2,3,3.5,4,5,6];
// 0.0.6test (Bei 11-10, exact merges): the ÷6 preset keeps VM_ROWS spare rows below the record so 6x6 (2x2 + ISP 3x3) and
// 3x6 + RWZM H 2:1 record exactly the RES with the vertical-margin floor (quality.py VM_ROWS); 1x2 / 1x3 are the anamorphic
// merge presets (full width, H / 2, H / 3), picked by label like the K ones.
const VM_ROWS = 10, ANA = [2, 3];
const binH = (H, r) => ev(H * r) - (r === 1/6 ? VM_ROWS : 0);   // an integer-bin ratio's preset height
const a16 = w => Math.floor(w / 16) * 16, ev = h => Math.floor(h / 2) * 2;
const kLabel = w => { const x = w / 1024;            // nearest .5 from 1K up; below 1K one decimal so ÷3/÷6 differ
  return (x < 0.75 ? (Math.round(x * 10) / 10).toFixed(1) : String(Math.round(x * 2) / 2)) + 'K'; };
const mm = px => (px * PX_MM).toFixed(1);

function divText(W, H, w, h) {                   // "3x2" when each axis is an integer bin plus < 1 alignment unit of crop (Bei 10-29 B)
  const n = [1,2,3,4,5,6,8,12].find(k => a16(W / k) === w),
    m = [1,2,3,4,5,6,8,12].find(k => ev(H / k) === h || (k === 6 && ev(H / k) - VM_ROWS === h));
  return n || m ? (n || '') + 'x' + (m || '') : '';        // one axis only: "2x" / "x3" (Bei 10-29)
}
function resList(W, H, dcName) {                 // presets for this DC: clean ratios ∪ 1K–6K, FHD/UHD on HD
  const items = [];
  for (const [r, n] of RATIOS) {                 // integer bins take H/k for the height (exact bin), ÷1.5 keeps the aspect
    const w = a16(W * r), h = Number.isInteger(1 / r) ? binH(H, r) : ev(w * H / W);
    if (w >= WMIN && h >= HMIN) items.push({w, h, ratio: true, div: divText(W, H, w, h), label: kLabel(w)});
  }
  for (const K of KS) {
    const w = a16(K * 1024); if (w > W || ev(w * H / W) < HMIN) continue;
    if (items.some(i => i.ratio && i.label === K + 'K')) continue;           // that K is already a clean ratio
    items.push({w, h: ev(w * H / W), exact: false, div: divText(W, H, w, ev(w * H / W)), label: K + 'K'});
  }
  if (dcName === 'HD') for (const [n, w, h] of [['UHD',3840,2160],['FHD',1920,1080]])
    items.push({w, h, exact: false, div: divText(W, H, w, h), label: n});
  for (const k of ANA) {                         // 1x2 / 1x3: labelled by the merge (div_text style)
    const w = a16(W), h = ev(H / k);
    if (w >= WMIN && h >= HMIN) items.push({w, h, exact: false, div: divText(W, H, w, h), label: '1x' + k});
  }
  const seen = new Set();
  items.forEach(i => { i.exact = i.div !== ''; });               // exact = both axes divide by an integer
  return items.filter(i => !seen.has(i.w + 'x' + i.h) && seen.add(i.w + 'x' + i.h)).sort((a, b) => a.w - b.w);     // small → large (Bei 10-29)
}

// ---- state -----------------------------------------------------------------------------------------------
const S = { dcW: 6048, dcH: 3402, dcLock: true, resRatio: 1/3, resCustom: null, resLock: true,
  dcAsp: 6048 / 3402, resAsp: 6048 / 3402, resK: null,
  memory: {}, sub: null, focus: 1, open: true, fps: 59.94, fpsCustom: null, fine: false, recipe: null, recipeD: null, kh: 1, kv: 1, km: 0,

$('cam').addEventListener('wheel', e => {
  e.preventDefault(); wheelAcc += e.deltaY || e.deltaX;
  if (Math.abs(wheelAcc) >= 40) { act((e.shiftKey ? 'r' : 'f') + (wheelAcc > 0 ? '+' : '-')); wheelAcc = 0; }
}, {passive: false});
// Click / tap / wheel only (Bei 11-04: no keypad): a tile selects, a selected tile with more options opens them, its
// ◀ ▶ step it (= front dial), « » on a numeric footer step ten (= rear dial), an option applies, the AEL chip opens /
// goes back, the QS chip opens / closes the Quick Set. The wheel over the screen is the front dial, Shift+wheel the rear.
$('qs').addEventListener('click', e => {
  const t = e.target.closest('.tile'), o = e.target.closest('.o'), ta = e.target.closest('.tarr');
  if (ta) return act((ta.dataset.d === '1' ? 'f+' : 'f-'));
  const sp = e.target.closest('.sp');
  if (sp) { if (sp.dataset.big) return act(sp.dataset.d === '1' ? 'r+' : 'r-'); layout()[S.focus].adj(+sp.dataset.d); return render(); }
  if (o && o.dataset.k !== undefined) { const f = layout()[S.focus]; f.pick(+o.dataset.k); return render(); }
  if (e.target.closest('#ael')) return act(S.sub ? 'menu' : 'ael');
  if (t && !t.classList.contains('blank')) {
    const i = +t.dataset.i, f = layout()[i];
    if (i === S.focus && f && f.more && !S.sub) return act('ael');
    if (S.fine) fineExit(); S.focus = i; render();
  }
});
$('qsbtn').addEventListener('click', () => act('qs'));
if (typeof pageInit === 'function') { pageInit(); pageBind(); }   // site_page.js: #<camera code>, or '#recipe' (test hook)
else if (location.hash === '#recipe') S.focus = 4;      // test hook: open with RECIPE focused
render();
</script>
