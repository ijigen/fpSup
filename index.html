.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;div&gt;&lt;label for=&quot;imx-code&quot;&gt;手動模擬 Analog code：&lt;span class=&quot;readout&quot; id=&quot;imx-code-value&quot;&gt;3000&lt;/span&gt;&lt;/label&gt;&lt;input id=&quot;imx-code&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;4094&quot; step=&quot;1&quot; value=&quot;3000&quot;&gt;&lt;div class=&quot;scale&quot;&gt;&lt;span&gt;0 · 1×&lt;/span&gt;&lt;span&gt;0xDFD · AR 門檻&lt;/span&gt;&lt;span&gt;4094&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;evidence-note&quot;&gt;&lt;strong&gt;注意：&lt;/strong&gt;這是研究用假設值，不是由 ISO 自動算出的實機值。真正 code 還依賴 LCG/HCG offset、sensor OTP、analog cap 與 gain-state；請勿把畫面組合視為該 ISO 的實際 register 狀態。&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;evidence-note&quot;&gt;&lt;strong&gt;完整模式表：&lt;/strong&gt;選單列出 V5.02 韌體的全部 70 個 logical modes；其中只有 24 組不同的 sensor register payload。full／crop 是韌體 metadata，不代表該模式已能錄影，也不能單獨證明是完整感光面的 Open Gate。選項末尾的 C16–C23 是尚未命名的 metadata class +0x60，只用來區分尺寸與表內幀率相同的不同模式。&lt;br&gt;&lt;strong&gt;幀率不是 mode 的固有屬性：&lt;/strong&gt;選單顯示的是韌體 timing table 的 VMAX 預設值，不是固定格式或硬性上限。實機已驗證 Mode 117 把 VMAX 2184 改為 7280，可由 99.900100p 改成 29.970030p；HMAX 不變，因此 9.221 ms 捲簾讀出不變。上方可另填幀率估算資料率；其他值是否可穩定錄影仍須逐模式驗證。&lt;/div&gt;

  &lt;div class=&quot;mode-summary&quot;&gt;&lt;div class=&quot;raster-box&quot;&gt;&lt;div class=&quot;raster&quot; id=&quot;raster&quot;&gt;4176×2174&lt;/div&gt;&lt;div class=&quot;mini&quot; id=&quot;mode-status&quot;&gt;韌體隱藏模式 · 尚未驗證整條錄影管線&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mode-metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;metric-pixels&quot;&gt;9.08 MP&lt;/strong&gt;sensor raster&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;metric-adc&quot;&gt;14-bit&lt;/strong&gt;ADC／RAW&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;metric-rate&quot;&gt;476.2 MB/s&lt;/strong&gt;純 pixel bitstream&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;metric-cap&quot;&gt;571 GB&lt;/strong&gt;20 分鐘／未壓縮&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;stage&quot; id=&quot;stage-ar&quot;&gt;&lt;div class=&quot;stage-title&quot;&gt;③ 變速箱 · Analog Readout&lt;/div&gt;&lt;div class=&quot;gear&quot; id=&quot;gear&quot;&gt;N&lt;/div&gt;&lt;div class=&quot;mini&quot; id=&quot;ar-caption&quot;&gt;Normal：低／中增益工作點&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;stage&quot;&gt;&lt;div class=&quot;stage-title&quot;&gt;④ 量尺 · ADC／RAW mode&lt;/div&gt;&lt;div class=&quot;adc&quot; id=&quot;adc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mini&quot; id=&quot;adc-caption&quot;&gt;Sensor 規格：11／12／14-bit&lt;br&gt;fp V5.02 表內：RAW12／RAW14&lt;/div&gt;&lt;/div&gt;

  &lt;/div&gt;

  &lt;div class=&quot;decision&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;LCG／HCG：依拍攝路徑與 ISO 決定&lt;/h3&gt;&lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;seg lcg&quot; id=&quot;cg-left&quot; style=&quot;width:33%&quot;&gt;LCG&lt;/div&gt;&lt;div class=&quot;seg hcg&quot; id=&quot;cg-right&quot; style=&quot;width:67%&quot;&gt;HCG&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;marker&quot; id=&quot;iso-marker&quot; style=&quot;--pos:25%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;factline&quot; id=&quot;cg-fact&quot;&gt;&lt;strong&gt;目前：HCG&lt;/strong&gt; · 一般影片從 ISO 640 切換&lt;/div&gt;&lt;div class=&quot;trade&quot;&gt;&lt;div&gt;LCG&lt;br&gt;&lt;strong&gt;較多高光空間&lt;/strong&gt;&lt;br&gt;暗部讀出噪聲較高&lt;/div&gt;&lt;div&gt;HCG&lt;br&gt;&lt;strong&gt;較乾淨暗部&lt;/strong&gt;&lt;br&gt;高光容量可能減少&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Normal／High AR：只看最終 Analog code&lt;/h3&gt;&lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;seg normal&quot; style=&quot;width:87.45%&quot;&gt;Normal AR&lt;/div&gt;&lt;div class=&quot;seg high&quot; style=&quot;width:12.55%&quot;&gt;High AR&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;marker&quot; id=&quot;code-marker&quot; style=&quot;--pos:73.3%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;factline&quot; id=&quot;ar-fact&quot;&gt;&lt;strong&gt;目前：Normal AR&lt;/strong&gt; · code 尚未達 0xDFD&lt;/div&gt;&lt;div class=&quot;trade&quot;&gt;&lt;div&gt;Normal AR&lt;br&gt;&lt;strong&gt;一般工作點&lt;/strong&gt;&lt;br&gt;適合低／中 analog gain&lt;/div&gt;&lt;div&gt;High AR&lt;br&gt;&lt;strong&gt;高增益配套&lt;/strong&gt;&lt;br&gt;調整讀出 bias／線性／黑位&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;matrix&quot; aria-label=&quot;韌體已確認的 HCG 切換表&quot;&gt;
    &lt;div class=&quot;cell head l&quot;&gt;ISO 區間&lt;/div&gt;&lt;div class=&quot;cell head&quot;&gt;靜態／一般影片&lt;/div&gt;&lt;div class=&quot;cell head&quot;&gt;RAW 8·10-bit&lt;/div&gt;&lt;div class=&quot;cell head&quot;&gt;RAW12&lt;/div&gt;
    &lt;div class=&quot;cell l&quot;&gt;100–500&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip lcg&quot;&gt;&lt;/i&gt;LCG&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip lcg&quot;&gt;&lt;/i&gt;LCG&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip lcg&quot;&gt;&lt;/i&gt;LCG&lt;/div&gt;
    &lt;div class=&quot;cell l&quot;&gt;640–2500&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip hcg&quot;&gt;&lt;/i&gt;HCG&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip hcg&quot;&gt;&lt;/i&gt;HCG&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip lcg&quot;&gt;&lt;/i&gt;LCG&lt;/div&gt;
    &lt;div class=&quot;cell l&quot;&gt;3200+&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip hcg&quot;&gt;&lt;/i&gt;HCG&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip hcg&quot;&gt;&lt;/i&gt;HCG&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip hcg&quot;&gt;&lt;/i&gt;HCG&lt;/div&gt;
    &lt;div class=&quot;cell l&quot;&gt;每個 ISO 的 AR&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip unknown&quot;&gt;&lt;/i&gt;需 OTP／實機 code&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip unknown&quot;&gt;&lt;/i&gt;需 OTP／實機 code&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;i class=&quot;chip unknown&quot;&gt;&lt;/i&gt;需 OTP／實機 code&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;evidence-note&quot;&gt;&lt;strong&gt;Expanded ISO：&lt;/strong&gt;ISO 6／12／25／50 在 V5.02 全部 clamp 成 ISO 100 sensor gain；ISO 51200／102400 超過 analog cap 的部分由 ISP digital gain 完成。兩者都不增加 sensor full-well 或捕捉到的光資訊。&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Register tuples 與控制鏈（V5.02 韌體確認）&lt;/summary&gt;
    &lt;table class=&quot;reg-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;組合&lt;/th&gt;&lt;th&gt;05E1&lt;/th&gt;&lt;th&gt;05E2&lt;/th&gt;&lt;th&gt;041F&lt;/th&gt;&lt;th&gt;05A6&lt;/th&gt;&lt;th&gt;05A8&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;LCG + Normal&lt;/td&gt;&lt;td&gt;00&lt;/td&gt;&lt;td&gt;00&lt;/td&gt;&lt;td&gt;00&lt;/td&gt;&lt;td&gt;29&lt;/td&gt;&lt;td&gt;27&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;LCG + High&lt;/td&gt;&lt;td&gt;00&lt;/td&gt;&lt;td&gt;01&lt;/td&gt;&lt;td&gt;0E&lt;/td&gt;&lt;td&gt;29&lt;/td&gt;&lt;td&gt;27&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;HCG + Normal&lt;/td&gt;&lt;td&gt;01&lt;/td&gt;&lt;td&gt;00&lt;/td&gt;&lt;td&gt;00&lt;/td&gt;&lt;td&gt;2A&lt;/td&gt;&lt;td&gt;29&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;HCG + High&lt;/td&gt;&lt;td&gt;01&lt;/td&gt;&lt;td&gt;01&lt;/td&gt;&lt;td&gt;1D&lt;/td&gt;&lt;td&gt;2A&lt;/td&gt;&lt;td&gt;29&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;p&gt;12-bit analog code：003D/003E = low/high nibble；003F/0040 為第二組相同 code。正常原廠路徑在 code ≥ 0x0DFD 時切 High AR。AR 的 Sony 官方電路名稱與獨立 ADC input-range register 尚未確認。&lt;/p&gt;
    &lt;p&gt;ISO LUT C00B8860/C00B8A38 → request C030C878 → split/dispatch C0312F18/C03131E0 → compose C0323580 → HCG C03239C8 → gain-state reshape C0323A78 → register writer C0323818。&lt;/p&gt;
  &lt;/details&gt;
  &lt;div class=&quot;sources&quot;&gt;已確認位址：gain compose 0xC0323580 · register writer 0xC0323818 · HCG selector 0xC03239C8 · AR threshold analog code 0x0DFD · OTP blob offset 0xC00 / 510 bytes&lt;/div&gt;

  &lt;section class=&quot;compare&quot; aria-labelledby=&quot;a7iii-title&quot;&gt;
    &lt;div class=&quot;lang-en&quot;&gt;
      &lt;h3 id=&quot;a7iii-title&quot;&gt;α7 III comparison: an IMX410-family match is not proof of an identical sensor&lt;/h3&gt;
      &lt;p class=&quot;compare-lead&quot;&gt;This records what is actually different between the ILCE-7M3 and fp. Sony does not publish the α7 III sensor part number, and no α7 III firmware register table has been matched here yet; “IMX410” therefore remains a family-level identification, not proof that the silicon, CFA mask, package, or output protocol is identical.&lt;/p&gt;
      &lt;div class=&quot;compare-grid&quot;&gt;
        &lt;div class=&quot;compare-cell head&quot;&gt;Evidence&lt;/div&gt;&lt;div class=&quot;compare-cell head&quot;&gt;Sony α7 III&lt;/div&gt;&lt;div class=&quot;compare-cell head&quot;&gt;SIGMA fp&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;Published geometry&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;OFFICIAL&lt;/span&gt;25.3 MP total, 24.2 MP effective; 6000×4000 still output. Sony names it only “Exmor R CMOS.”&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;FIRMWARE&lt;/span&gt;6064×4042 full readout in V5.02. The public IMX410CQK flyer says 6064×4040 active; the two-line accounting difference does not establish a different die.&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;Exact sensor identity&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;INFERENCE&lt;/span&gt;Pixel count, 5.94 µm-class pitch and readout family are consistent with IMX410, but an official ILCE-7M3 part-number source has not been found.&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;OPEN&lt;/span&gt;The mode geometry strongly matches IMX410CQK. It still does not prove that the fp and α7 III use the same CFA / PDAF-mask variant.&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;Physical phase pixels&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;CONFIRMED&lt;/span&gt;693 focal-plane phase-detect points are official. Repeating masked-PDAF rows are also visible in α7 III RAW artifacts and have camera-specific correction support.&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;UNKNOWN&lt;/span&gt;SIGMA specifies 49-point contrast AF. No periodic masked-row signature has yet been demonstrated from fp CinemaDNG, so presence or absence of a physical PDAF mask remains unresolved.&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;PDAF software path&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;FUNCTIONAL&lt;/span&gt;Fast Hybrid AF consumes phase data in the shipping camera. The exact sensor registers and AF-statistics transport are not extracted here.&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;DEAD CODE&lt;/span&gt;The shared firmware contains PdCaf drive and defocus code, but AF-model vtable slot +0x184 always returns 0; setup, pkcnt writes and availability checks are gated off, and measured_defocus stays at −0x80000000.&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;Phase-data route&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;PARTIAL&lt;/span&gt;Masked-row artifacts prove that PDAF photosites affect the ordinary RAW raster. They do not prove that Sony lacks a second internal tap or auxiliary statistics channel.&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;NOT FOUND&lt;/span&gt;No separate PDAF virtual channel, embedded-data payload, or receiver path has been identified. SLVS-EC capability by itself is not evidence of phase data.&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;Readout / Open Gate&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;OFFICIAL&lt;/span&gt;Still capture is 3:2, but shipping movie formats top out at 3840×2160 or 1920×1080. There is no selectable 3:2 Open Gate movie mode.&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;MEASURED&lt;/span&gt;The firmware exposes 3:2 full modes. Mode 117 has run at 3032×2012 / 29.970p by changing VMAX only; sensor-side mode use is verified, while the final 3:2 recording canvas remains unfinished.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;compare-notes&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Current conclusion.&lt;/strong&gt; α7 III proves that an IMX410-family camera can be built with physically masked PDAF pixels. It does not prove that PDAF can be enabled on fp by copying registers. Until the fp RAW raster shows the mask, the leading difference may be sensor hardware rather than a disabled output channel.&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Decisive fp test.&lt;/strong&gt; Capture unprocessed CinemaDNG under strong backlight / flare plus matched flat fields, then search row residuals for a stable periodic pattern across frames and ISOs. A positive pattern locates the physical mask; a negative result narrows the case but only die/package inspection can make absence conclusive.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sources&quot;&gt;Sources: &lt;a href=&quot;https://www.sony.com/electronics/support/e-mount-body-ilce-7-series/ilce-7m3/specifications&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Sony ILCE-7M3 specifications&lt;/a&gt; · &lt;a href=&quot;https://www.sony-semicon.com/files/62/pdf/p-13_IMX410CQK_Flyer.pdf&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Sony IMX410CQK flyer&lt;/a&gt; · &lt;a href=&quot;https://www.sigma-global.com/en/cameras/fp/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;SIGMA fp specifications&lt;/a&gt; · &lt;a href=&quot;https://rawpedia.rawtherapee.com/Preprocessing&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;RawTherapee PDAF-line support&lt;/a&gt; · &lt;a href=&quot;https://aggregate.org/DIT/EI2019/karwysr.pdf&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;A7 III masked-pixel artifact study&lt;/a&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;lang-zh&quot;&gt;
      &lt;h3&gt;α7 III 對照：同屬 IMX410 家族，不代表是完全相同的感光元件&lt;/h3&gt;
      &lt;p class=&quot;compare-lead&quot;&gt;這裡只記錄 ILCE-7M3 與 fp 已有證據支持的差異。Sony 沒有公開 α7 III 的 sensor part number，而這裡也還沒有把 α7 III 韌體的 register table 對上；因此「IMX410」目前是家族層級的辨識，不能當成 silicon、CFA 遮罩、封裝或輸出協定完全相同的證明。&lt;/p&gt;
      &lt;div class=&quot;compare-grid&quot;&gt;
        &lt;div class=&quot;compare-cell head&quot;&gt;證據項目&lt;/div&gt;&lt;div class=&quot;compare-cell head&quot;&gt;Sony α7 III&lt;/div&gt;&lt;div class=&quot;compare-cell head&quot;&gt;SIGMA fp&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;公開幾何&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;官方&lt;/span&gt;總像素 25.3 MP、有效 24.2 MP，照片輸出 6000×4000；Sony 只稱 Exmor R CMOS。&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;韌體&lt;/span&gt;V5.02 的完整讀出是 6064×4042。公開 IMX410CQK flyer 是 active 6064×4040；這兩列的記帳差異不足以證明 die 不同。&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;精確型號&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;推測&lt;/span&gt;像素數、約 5.94 µm pixel pitch 與讀出家族都符合 IMX410，但尚未找到 Sony 官方把 ILCE-7M3 對到該 part number 的資料。&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;未解&lt;/span&gt;mode 幾何高度符合 IMX410CQK，但仍不能證明 fp 和 α7 III 使用相同的 CFA／PDAF mask 版本。&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;物理相位像素&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;已確認&lt;/span&gt;官方明列 693 點焦平面相位偵測；α7 III RAW 也會出現週期性 masked-PDAF rows 的條紋，已有機種專用校正。&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;未知&lt;/span&gt;SIGMA 官方只有 49 點對比 AF。目前尚未從 fp CinemaDNG 證明週期性 masked-row signature，所以物理 PDAF 遮罩存在與否仍未定案。&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;PDAF 軟體路徑&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;運作中&lt;/span&gt;量產機的 Fast Hybrid AF 確實消耗相位資料；但此處尚未抽出它的 sensor registers 或 AF statistics transport。&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;死碼&lt;/span&gt;共用韌體有 PdCaf 驅動與 defocus 程式，但 AF-model vtable slot +0x184 固定回 0；setup、pkcnt 寫入、availability check 全被 gate，measured_defocus 恆為 −0x80000000。&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;相位資料路線&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;部分證據&lt;/span&gt;masked-row artifact 證明 PDAF photosites 會影響普通 RAW raster；但它不能證明 Sony 內部沒有第二個 tap 或輔助統計通道。&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag infer&quot;&gt;尚未找到&lt;/span&gt;目前未識別到獨立 PDAF virtual channel、embedded-data payload 或 receiver path；只有 SLVS-EC 能力不能當成相位資料證據。&lt;/div&gt;
        &lt;div class=&quot;compare-cell key&quot;&gt;讀出／Open Gate&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;官方&lt;/span&gt;照片可用 3:2，但量產影片只有最高 3840×2160 或 1920×1080，沒有可選的 3:2 Open Gate 錄影。&lt;/div&gt;&lt;div class=&quot;compare-cell&quot;&gt;&lt;span class=&quot;evidence-tag&quot;&gt;實機&lt;/span&gt;韌體有 3:2 full modes。Mode 117 已靠只改 VMAX 跑到 3032×2012／29.970p，sensor-side mode 實錄讀回已確認；最終 3:2 錄影畫布仍未完成。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;compare-notes&quot;&gt;
        &lt;div&gt;&lt;strong&gt;目前結論。&lt;/strong&gt;α7 III 證明 IMX410 家族可以做成帶物理 masked PDAF pixels 的版本，但不能證明把 register 搬到 fp 就能開 PDAF。除非先在 fp RAW raster 找到遮罩，首要差異更可能是 sensor hardware，而不是一條被關閉的輸出 channel。&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;能定案的 fp 測試。&lt;/strong&gt;用強逆光／flare 拍未處理 CinemaDNG，再配合 flat-field，跨影格與 ISO 搜尋固定週期的 row residual。找到週期即可定位物理遮罩；找不到只能縮小可能性，要宣判完全不存在仍需 die／封裝層級檢查。&lt;/div&gt;
