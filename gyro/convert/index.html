<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fpSup 陀螺記錄轉檔</title>
<style>
  :root{
    --bg:#0f1012; --panel:#17191c; --line:#2a2e33; --ink:#e8eaed; --dim:#9aa0a6;
    --sig:#f0a54a; --sig-soft:#2a2118; --ok:#68c096; --bad:#e2686a;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  :root:not([data-theme="dark"]){
    @media (prefers-color-scheme: light){
      --bg:#fbfbfc; --panel:#fff; --line:#e3e5e8; --ink:#1b1d20; --dim:#6b7076;
      --sig:#b96f12; --sig-soft:#fdf4e7; --ok:#2e7d55; --bad:#b83034;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  main{max-width:56rem;margin:0 auto;padding:28px 16px 64px}
  h1{margin:0 0 6px;font-size:1.4rem;font-weight:600;letter-spacing:-.01em}
  .sub{margin:0 0 22px;color:var(--dim);max-width:54ch}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:16px;margin-bottom:16px}
  .drop{padding:26px 16px;border:1px dashed var(--line);border-radius:4px;
    text-align:center;cursor:pointer;transition:border-color .12s,background .12s}
  .drop:hover,.drop.over{border-color:var(--sig);background:var(--sig-soft)}
  .drop b{display:block;font-size:.95rem}
  .drop small{display:block;color:var(--dim);margin-top:5px}
  .drop u{color:var(--sig)}
  table{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:4px}
  th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--dim);padding:0 10px 6px 0;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.k{color:var(--dim);white-space:nowrap}
  code,.mono{font-family:var(--mono);font-size:.86em}
  .tag{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:1px 7px;
    border-radius:3px;background:var(--sig-soft);color:var(--sig);border:1px solid var(--line)}
  .note{margin:10px 0 0;padding:10px 12px;border-left:2px solid var(--sig);
    background:var(--sig-soft);font-size:.84rem;color:var(--dim)}
  .note.bad{border-left-color:var(--bad)}
  .note b{color:var(--ink)}
  .btn{appearance:none;font:inherit;font-family:var(--mono);font-size:.86rem;
    padding:9px 14px;border:1px solid var(--line);border-radius:3px;cursor:pointer;
    background:var(--panel);color:var(--ink);margin:14px 8px 0 0}
  .btn.go{background:var(--sig);border-color:var(--sig);color:#1b1206;font-weight:600}
  .btn[disabled]{opacity:.45;cursor:default}
  label.ck{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:.88rem}
  label.ck small{display:block;color:var(--dim)}
  footer{margin-top:34px;color:var(--dim);font-size:.82rem;max-width:64ch}
  .lang{display:flex;gap:4px;justify-content:flex-end;margin-bottom:10px}
  .lang button{appearance:none;font:inherit;font-size:.8rem;padding:3px 9px;cursor:pointer;
    border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--dim)}
  .lang button[aria-pressed="true"]{color:var(--sig);border-color:var(--sig)}
</style>
</head>
<body>
<main>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="zh-Hans">简</button>
    <button type="button" data-lang="zh-Hant">繁</button>
  </div>
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="sub"></p>
  <p class="sub" data-i18n="newold"></p>

  <div class="panel">
    <div id="drop" class="drop">
      <input type="file" id="file" accept=".GYR,.gyr,.BIN,.bin" hidden>
      <b data-i18n="drop"></b>
      <small data-i18n="dropsub"></small>
    </div>
    <div id="out"></div>
  </div>

  <footer data-i18n="footer"></footer>
</main>

<script>
/* Three languages, EN / 简 / 繁 (2026-09-26).  Only what the page shows is
 * translated; the .gcsv it writes is the same bytes in every language. */
const I18N = {
  en: {
    title: 'fpSup gyro log converter',
    sub: 'Drop the <code>.GYR</code> the camera wrote and get the <code>.gcsv</code> Gyroflow reads. Everything happens in this page; nothing is uploaded.',
    newold: 'This is the current converter. For a lens profile (<code>.json</code>) use the <a href="../web/">older converter</a>.',
    drop: 'Drop a .GYR here',
    dropsub: 'or <u>choose a file</u>. Old and new formats are both read; the version is detected.',
    footer: 'No lens profile is made here. The Base edition does not write a <code>.json</code>; if you need one, the <a href="../web/">older converter</a> makes it from the lens you name. The gcsv edition writes it on the camera, beside the clip.',
    short: 'Shorter than a header',
    unknownfmt: 'The start of this file is not recognised: it is not an fpSup gyro log',
    noperiod: 'The header has no sample period',
    trunc: 'The body is {body} bytes, {rem} over a multiple of {rec}. The file was cut off part-way, and records have no framing, so every one after the break is misaligned.',
    badtag: '{n} records have a tag that is neither 0 nor 1. That field is the only place misalignment shows, so part of this file is damaged.',
    cantread: 'Cannot read',
    item: 'Item', value: 'Value',
    format: 'Format', clip: 'Clip', gyro: 'Gyro samples', rate: 'Sample rate', accel: 'Accelerometer', orient: 'Axes',
    samples: '{n} samples · {s} s', ratev: '{hz} Hz ({us} µs per sample)', accelv: '{n} samples · {hz} Hz',
    fmt_v7: 'v7 — 64-byte header', fmt_v8: 'new — 20-byte header',
    x_mode: 'Sensor mode', x_size: 'Frame size', x_drop: 'Dropped blocks',
    withacc: 'Include the accelerometer', withaccsub: 'Gyroflow uses it to find the direction of gravity. A log without accelerometer readings has no such column.',
    dl: 'Download .gcsv',
  },
  'zh-Hans': {
    title: 'fpSup 陀螺仪记录转换',
    sub: '把相机写的 <code>.GYR</code> 拖进来，换成 Gyroflow 读取的 <code>.gcsv</code>。全部在这一页里完成，不会上传任何东西。',
    newold: '这是新版转换器。需要镜头 profile（<code>.json</code>）时用<a href="../web/">旧版转换器</a>。',
    drop: '把 .GYR 拖进来',
    dropsub: '或 <u>选一个文件</u>。新旧格式都能读，版本自动判断。',
    footer: '这里不生成镜头 profile。Base 版不会写 <code>.json</code>；需要时用<a href="../web/">旧版转换器</a>，依你指定的镜头生成。gcsv 版会在相机上把它写在片段旁边。',
    short: '比一个文件头还短',
    unknownfmt: '认不出这个文件的开头 —— 它不是 fpSup 的陀螺仪记录',
    noperiod: '文件头没有采样周期',
    trunc: '主体是 {body} 字节，除以 {rec} 余 {rem}。文件在中途被截断了，而记录没有分隔，所以断点之后的每一条都会错位。',
    badtag: '{n} 条记录的 tag 既不是 0 也不是 1。这一栏是错位唯一看得见的地方，所以这个文件有一段是坏的。',
    cantread: '读不了',
    item: '项目', value: '值',
    format: '格式', clip: '片段', gyro: '陀螺仪样本', rate: '采样率', accel: '加速度', orient: '轴向',
    samples: '{n} 条 · {s} 秒', ratev: '{hz} Hz（每条 {us} µs）', accelv: '{n} 条 · {hz} Hz',
    fmt_v7: 'v7 — 64 字节文件头', fmt_v8: '新版 — 20 字节文件头',
    x_mode: '传感器模式', x_size: '画幅尺寸', x_drop: '丢失区块',
    withacc: '把加速度一起写进去', withaccsub: 'Gyroflow 用它推算重力方向。没有加速度的记录就没有这一栏。',
    dl: '下载 .gcsv',
  },
  'zh-Hant': {
    title: 'fpSup 陀螺記錄轉檔',
    sub: '把相機寫的 <code>.GYR</code> 拖進來，換成 Gyroflow 吃的 <code>.gcsv</code>。全部在這一頁裡做完，沒有東西被上傳。',
    newold: '這是新版轉檔器。需要鏡頭 profile（<code>.json</code>）時用<a href="../web/">舊版轉檔器</a>。',
    drop: '把 .GYR 拖進來',
    dropsub: '或 <u>選一個檔案</u>。新舊格式都讀得動，版本自動判斷。',
    footer: '鏡頭 profile 不在這裡產。Base 版不會寫 <code>.json</code>；需要時用<a href="../web/">舊版轉檔器</a>，依你指定的鏡頭產生。gcsv 版會在相機上把它寫在片段旁邊。',
    short: '比一個檔頭還短',
    unknownfmt: '認不得這個檔案的開頭 —— 它不是 fpSup 的陀螺記錄',
    noperiod: '檔頭沒有取樣週期',
    trunc: '本體是 {body} 位元組，除以 {rec} 餘 {rem}。檔案在中途被截斷了，而記錄沒有框，所以斷點之後的每一筆都會錯位。',
    badtag: '{n} 筆記錄的 tag 既不是 0 也不是 1。這一欄是錯位唯一看得見的地方，所以這個檔案有一段是壞的。',
    cantread: '讀不了',
    item: '項目', value: '值',
    format: '格式', clip: '片段', gyro: '陀螺樣本', rate: '取樣率', accel: '加速度', orient: '軸向',
    samples: '{n} 筆 · {s} 秒', ratev: '{hz} Hz（每筆 {us} µs）', accelv: '{n} 筆 · {hz} Hz',
    fmt_v7: 'v7 — 64 位元組檔頭', fmt_v8: '新版 — 20 位元組檔頭',
    x_mode: '感光元件模式', x_size: '畫格尺寸', x_drop: '掉落區塊',
    withacc: '把加速度一起寫進去', withaccsub: 'Gyroflow 用它推重力方向。沒有加速度的記錄就沒有這一欄。',
    dl: '下載 .gcsv',
  },
};
function pickLang() {
  try { const s = localStorage.getItem('fpsup-convert-lang'); if (s && I18N[s]) return s; } catch (e) {}
  const nav = (navigator.languages || [navigator.language || 'en']).map(x => String(x).toLowerCase());
  for (const l of nav) {
    if (!l.startsWith('zh')) continue;
    return /(hant|tw|hk|mo)/.test(l) ? 'zh-Hant' : 'zh-Hans';
  }
  return 'en';
}
let LANG = typeof navigator === 'undefined' ? 'en' : pickLang();
/* A message is kept as a key and its values, not as text, so switching the
 * language re-renders it in the new one. */
const T = (key, vars) => (I18N[LANG][key] ?? I18N.en[key] ?? key)
  .replace(/\{(\w+)\}/g, (_, k) => vars && k in vars ? vars[k] : '{' + k + '}');
class Msg extends Error {
  constructor(key, vars) { super(key); this.key = key; this.vars = vars; }
  get text() { return T(this.key, this.vars); }
}

/* Two header layouts, one body.
 *
 * The records have never differed: eight bytes, x at 0, y at 2, tag at 4, z at
 * 6, one flat interleaved array, and position is the clock -- a tag 0 advances
 * one sample period, a tag 1 does not.  What changed is only what sits in
 * front of them.
 *
 * v7 put sixty-four bytes there and most of it described the take: sensor mode,
 * frame size, exposure, clip id.  The reader needed almost none of it and the
 * page used the rest to BUILD a lens profile -- badly, because the header
 * carries no focal length and no distortion, so it asked the user for one and
 * wrote zeros for the other.
 *
 * The camera writes the profile itself now, so the descriptive half had no
 * reader left and the header is twenty bytes: the four things you cannot read
 * the records without, and a magic.  Those four are values rather than a
 * version number on purpose -- recalibrating changes the numbers in the file
 * and nothing here needs teaching.  A new magic means the LAYOUT moved, which
 * is the only thing this code would have to be told about.
 */
const FMT = {
  v7: {
    name: 'GFS7', hdr: 64, label: 'fmt_v7',
    detect: d => d.getUint32(0, true) === 0x37534647,      // "GFS7"
    read: d => ({
      periodPs: d.getUint32(8, true),
      gscale:   d.getFloat32(12, true),
      ascale:   1 / 1024,           // not in this header; the writer's constant
      orient:   str(d, 16, 4),
      clip:     str(d, 20, 8),
      extra: {
        x_mode: d.getUint32(40, true) || '—',
        x_size: (d.getUint32(48, true) || '?') + ' × ' + (d.getUint32(52, true) || '?'),
        x_drop: d.getUint32(36, true),
      },
    }),
  },
  v8: {
    name: 'fpSup stream', hdr: 20, label: 'fmt_v8',
    detect: d => d.getUint32(0, true) === 0x9F5BEB0D,
    read: d => ({
      periodPs: d.getUint32(4, true),
      gscale:   d.getFloat32(8, true),
      ascale:   d.getFloat32(12, true),
      orient:   str(d, 16, 4),
      clip:     '',                 // the filename is the clip id now
      extra: {},
    }),
  },
};

const REC = 8, TAG_GYRO = 0, TAG_ACCEL = 1;
const $ = s => document.querySelector(s);
const trim = x => String(Number(x.toPrecision(12)));

function str(d, at, n) {
  let s = '';
  for (let i = 0; i < n; i++) { const c = d.getUint8(at + i); if (!c) break; s += String.fromCharCode(c); }
  return s;
}

function read(buf, filename) {
  const d = new DataView(buf);
  if (buf.byteLength < 20) throw new Msg('short');
  const key = Object.keys(FMT).find(k => FMT[k].detect(d));
  if (!key) throw new Msg('unknownfmt');
  const f = FMT[key];
  const h = f.read(d);
  if (!h.periodPs) throw new Msg('noperiod');

  const body = buf.byteLength - f.hdr;
  const c = {
    fmt: f, file: filename,
    clip: h.clip || filename.replace(/\.[^.]*$/, ''),
    periodS: h.periodPs / 1e12, gscale: h.gscale, ascale: h.ascale,
    orientation: h.orient, extra: h.extra, warnings: [],
  };
  if (body % REC) c.warnings.push({bad: true, key: 'trunc',
    vars: {body, rec: REC, rem: body % REC}});

  const n = Math.floor(body / REC);
  const gx = new Int16Array(n), gy = new Int16Array(n), gz = new Int16Array(n);
  const aAt = [], ax = [], ay = [], az = [];
  let ng = 0, unknown = 0;
  for (let i = 0; i < n; i++) {
    const o = f.hdr + i * REC, tag = d.getInt16(o + 4, true);
    if (tag === TAG_GYRO) {
      gx[ng] = d.getInt16(o, true);
      gy[ng] = d.getInt16(o + 2, true);
      gz[ng] = d.getInt16(o + 6, true);
      ng++;
    } else if (tag === TAG_ACCEL) {
      // No time of its own: it belongs to the gyro record it landed against.
      aAt.push(ng);
      ax.push(d.getInt16(o, true));
      ay.push(d.getInt16(o + 2, true));
      az.push(d.getInt16(o + 6, true));
    } else unknown++;
  }
  if (unknown) c.warnings.push({bad: true, key: 'badtag', vars: {n: unknown}});

  Object.assign(c, {n: ng, gx, gy, gz, aAt, ax, ay, az});
  c.durationS = ng * c.periodS;
  c.accelHz = c.durationS ? aAt.length / c.durationS : 0;
  return c;
}

/* The gcsv the camera writes for its other edition, to the byte.  Anything this
 * page emits has to be interchangeable with that file. */
function gcsv(c, withAccel) {
  const out = [
    'GYROFLOW IMU LOG', 'version,1.3',
    'id,sigma_fp_v502_internal_icm20321',
    `orientation,${c.orientation}`,
    `note,${c.fmt.name} ${c.clip}`,
    'fwversion,SIGMA fp 5.02',
    `videofilename,${c.clip}`,
    `tscale,${trim(c.periodS)}`,      // t counts samples, so this is the clock
    `gscale,${trim(c.gscale)}`,
  ];
  if (withAccel) {
    out.push(`ascale,${trim(c.ascale)}`, 't,gx,gy,gz,ax,ay,az');
    // Hold the last reading rather than interpolate, and seed with the first
    // real one: a row of zero gravity at the head of a file is not a
    // measurement.  The accelerometer's axes are not the gyro's and gcsv
    // carries one orientation for both, so a quarter turn goes here.
    let j = 0, lx = c.ax[0] ?? 0, ly = c.ay[0] ?? 0, lz = c.az[0] ?? 0;
    for (let i = 0; i < c.n; i++) {
      while (j < c.aAt.length && c.aAt[j] <= i) { lx = c.ax[j]; ly = c.ay[j]; lz = c.az[j]; j++; }
      out.push(`${i},${c.gx[i]},${c.gy[i]},${c.gz[i]},${ly},${-lx},${lz}`);
    }
  } else {
    out.push('t,gx,gy,gz');
    for (let i = 0; i < c.n; i++) out.push(`${i},${c.gx[i]},${c.gy[i]},${c.gz[i]}`);
  }
  return out.join('\n') + '\n';
}

function save(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv'}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

let cap = null, lastErr = null;

function render(c, err) {
  const out = $('#out');
  if (err) {
    const text = err instanceof Msg ? err.text : err.message;
    out.innerHTML = `<p class="note bad"><b>${T('cantread')}</b> ${text}</p>`;
    return;
  }
  if (!c) { out.innerHTML = ''; return; }
  const acc = document.getElementById('acc');
  const accOn = acc ? acc.checked : !!c.aAt.length;
  const rows = [
    [T('format'), `<span class="tag">${T(c.fmt.label)}</span>`],
    [T('clip'), `<span class="mono">${c.clip}</span>`],
    [T('gyro'), T('samples', {n: `<span class="mono">${c.n.toLocaleString()}</span>`,
                             s: c.durationS.toFixed(3)})],
    [T('rate'), T('ratev', {hz: `<span class="mono">${(1 / c.periodS).toFixed(3)}</span>`,
                           us: (c.periodS * 1e6).toFixed(4)})],
    [T('accel'), c.aAt.length
        ? T('accelv', {n: `<span class="mono">${c.aAt.length.toLocaleString()}</span>`,
                       hz: c.accelHz.toFixed(1)})
        : '—'],
    [T('orient'), `<span class="mono">${c.orientation}</span>`],
    ...Object.entries(c.extra).map(([k, v]) => [T(k), `<span class="mono">${v}</span>`]),
  ];
  out.innerHTML =
    `<table><thead><tr><th>${T('item')}</th><th>${T('value')}</th></tr></thead><tbody>` +
    rows.map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join('') +
    '</tbody></table>' +
    c.warnings.map(w => `<p class="note${w.bad ? ' bad' : ''}">${T(w.key, w.vars)}</p>`).join('') +
    `<label class="ck"><input type="checkbox" id="acc" ${c.aAt.length ? (accOn ? 'checked' : '') : 'disabled'}>
      <span>${T('withacc')}
      <small>${T('withaccsub')}</small></span></label>
     <button class="btn go" id="go">${T('dl')}</button>`;
  $('#go').onclick = () => save(c.clip + '.gcsv', gcsv(c, $('#acc').checked && !!c.aAt.length));
}

function setLang(l) {
  LANG = I18N[l] ? l : 'en';
  try { localStorage.setItem('fpsup-convert-lang', LANG); } catch (e) {}
  document.documentElement.lang = LANG === 'en' ? 'en' : LANG;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.innerHTML = T(e.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  render(cap, lastErr);
}

function load(f) {
  const rd = new FileReader();
  rd.onload = () => {
    try { cap = read(rd.result, f.name); lastErr = null; render(cap); }
    catch (e) { cap = null; lastErr = e; render(null, e); }
  };
  rd.readAsArrayBuffer(f);
}

const drop = $('#drop'), fin = $('#file');
drop.onclick = () => fin.click();
fin.onchange = e => { if (e.target.files[0]) load(e.target.files[0]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(k => drop.addEventListener(k, e => {
  e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(k => drop.addEventListener(k, e => {
  e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
setLang(LANG);
</script>
</body>
</html>
