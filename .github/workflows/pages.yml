name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The tables in index.html and README.md are generated from releases/.
      # This only checks — it does not rewrite — because GitHub renders
      # README.md from the commit, not from the Pages artifact, so a fix made
      # here would never reach the repository's own front page.
      - name: Releases tables are current
        run: python3 tools/build_releases.py --check
      # assets/ is generated too — tools/build_assets.py from assets/src/ — but it
      # is deliberately NOT checked here. PNG encoding is not byte-reproducible
      # across Pillow and libpng versions, and the social card's type is fetched
      # from Google Fonts at build time, so a --check in CI would fail on a runner
      # image update rather than on anything being wrong. Rerun it by hand after
      # a redraw; a stale image is cosmetic, not a broken page.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
