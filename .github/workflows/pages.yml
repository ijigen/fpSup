name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write: the deploy creates the GitHub Release of each sup version the Merge
  # page offers (tools/merge-v4/publish_releases.py); GitHub counts their downloads.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The repository also holds research/ and projects/ (about 14 GB). The site
      # is only fpSup/, so fetch that alone: no blobs outside the sparse paths
      # are downloaded.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            fpSup
            .github
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The tables in releases.html and README.md are generated from releases/.
      # This only checks — it does not rewrite — because GitHub renders
      # README.md from the commit, not from the Pages artifact, so a fix made
      # here would never reach the repository's own front page.
      - name: Releases tables are current
        working-directory: fpSup
        run: python3 tools/build_releases.py --check
      # assets/ is generated too — tools/build_assets.py from assets/src/ — but it
      # is deliberately NOT checked here. PNG encoding is not byte-reproducible
      # across Pillow and libpng versions, and the social card's type is fetched
      # from Google Fonts at build time, so a --check in CI would fail on a runner
      # image update rather than on anything being wrong. Rerun it by hand after
      # a redraw; a stale image is cosmetic, not a broken page.
      # Before the page goes out: every sup version it offers is a release with
      # exactly the page's bytes, so the asset URLs the page requests exist.
      # Existing releases are never rewritten; other bytes under a tag fail here.
      - name: Offered sups are GitHub Releases
        working-directory: fpSup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/merge-v4/publish_releases.py --publish --target "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fpSup
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
